# This is a Declarative Automation Bundle definition for bund_project_medallion_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bund_project_medallion_databricks
  uuid: c9f74697-e2c4-4ad3-8b5c-dafbf71a09be

include:
  - resources/*.yml

# Variables que cambian según el ambiente (se asignan en cada target).
# Los schemas (bronze/silver/gold) son fijos y se definen en cada task del job.
variables:
  storage_name:
    description: "Storage account (ADLS Gen2) del ambiente"
  credential_name:
    description: "Storage Credential de Unity Catalog del ambiente"
  warehouse_id:
    description: "SQL Warehouse que ejecuta las consultas del dashboard"
    lookup:
      # Se busca por nombre en el workspace de cada ambiente
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    # - Los recursos desplegados llevan el prefijo '[dev my_user_name]'
    # - Los schedules y triggers quedan en pausa
    mode: development
    default: true
    workspace:
      host: https://adb-7405612293435633.13.azuredatabricks.net
    variables:
      storage_name: "adlsdvbtdev01"
      credential_name: credential_dev

  prod:
    mode: production
    workspace:
      host: https://adb-7405606644802966.6.azuredatabricks.net
      root_path: /Workspace/Users/diana.bernalt@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      storage_name: "adlsdvbtprod01"
      credential_name: credential_prod

    permissions:
      - user_name: diana.bernalt@outlook.com
        level: CAN_MANAGE
